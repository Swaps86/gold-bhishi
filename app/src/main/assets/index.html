<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Apna Khata</title>
<style>
:root{--bg:#FFF9EC;--ink:#2B2113;--muted:#6B5A3A;--gold:#8A5F00;--soft:#F3E6BF;--line:#E8DBB8;--edge:#CDB985;--red:#A3261A;--green:#2F6B2F}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:system-ui,-apple-system,Roboto,sans-serif;background:var(--bg);color:var(--ink);font-size:16px}
#app{display:flex;flex-direction:column;height:100%}
#main{flex:1;overflow-y:auto;padding:16px 16px 24px}
h1{margin:0;font-size:22px;letter-spacing:-.01em}
h2{margin:0;font-size:15px}
.muted{color:var(--muted);font-size:12px}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.col{display:flex;flex-direction:column;gap:6px}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px}
.dark{background:#2B2113;color:#FFF9EC;border-radius:16px;padding:16px;margin-bottom:12px}
.dark .lbl{font-size:12px;color:#E5D3A8}
.big{font-size:30px;font-weight:700;letter-spacing:-.02em}
.grid4{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.f label{display:block;font-size:11px;color:var(--muted);margin-bottom:2px}
input,textarea{width:100%;border:1px solid var(--edge);border-radius:10px;padding:0 12px;font-size:16px;color:var(--ink);background:#fff;font-family:inherit}
input{height:44px}
textarea{padding:10px 12px;height:120px}
button{font-family:inherit;font-size:15px;font-weight:700;border:0;border-radius:12px;height:48px;padding:0 18px;background:var(--gold);color:#fff}
button.ghost{background:transparent;color:#6B4800;border:2px dashed var(--gold);width:100%}
button.soft{background:var(--soft);color:#3F2C00}
button.small{white-space:nowrap;flex-shrink:0;height:36px;font-size:13px;padding:0 12px}
button.danger{background:transparent;color:var(--red);height:36px;font-size:13px}
.seg{display:flex;gap:10px}
.seg button{flex:1;height:52px;font-size:17px;background:#fff;color:#4A3D27;border:1px solid var(--edge)}
.seg button.on{background:var(--soft);color:#3F2C00;border:2px solid var(--gold)}
.chips{display:flex;gap:8px;overflow-x:auto;margin-bottom:12px}
.chips button{height:36px;font-size:13px;white-space:nowrap;background:#fff;color:#4A3D27;border:1px solid var(--edge)}
.chips button.on{background:var(--soft);border:2px solid var(--gold);color:#3F2C00}
.loss{color:var(--red)}.gain{color:var(--green)}
.dark .loss{color:#FFB4A8}.dark .gain{color:#9FE0A0}
.badge{width:28px;height:28px;border-radius:14px;background:var(--soft);color:#5E4300;font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center}
nav{display:flex;border-top:1px solid var(--line);background:#fff;height:64px}
nav button{flex:1;height:64px;border-radius:0;background:#fff;color:var(--muted);font-size:12px;font-weight:600;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
nav button.on{color:#6B4800;font-weight:700}
select{width:100%;height:44px;border:1px solid var(--edge);border-radius:10px;padding:0 10px;font-size:16px;background:#fff;color:var(--ink);font-family:inherit}
.pad{height:12px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
button.acc{height:auto;min-height:132px;background:#fff;color:var(--ink);border:1px solid var(--line);border-radius:14px;padding:14px;text-align:left;font-weight:400;display:flex;flex-direction:column;align-items:stretch;gap:6px}
button.acc .tag{align-self:flex-start;font-size:12px;font-weight:700;color:#3F2C00;background:var(--soft);border-radius:8px;padding:2px 8px}
button.acc .tag.blue{color:#1F4A5A;background:#D8ECF3}
button.acc .nm{font-size:16px;font-weight:700}
button.acc .sub{font-size:12px;color:var(--muted)}
button.acc .val{margin-top:auto;font-size:18px;font-weight:700}
button.newbox{height:auto;min-height:104px;background:transparent;border:2px dashed var(--gold);color:#6B4800;border-radius:14px;padding:14px;text-align:left;display:flex;flex-direction:column;align-items:flex-start;gap:6px}
button.newbox.blue{border-color:#1F6A86;color:#1F4A5A}
button.newbox .sub{font-size:12px;font-weight:400;color:var(--muted)}
.gave{background:#A3261A}.got{background:#2F6B2F}
button.acc .tag.purple{color:#3F2A63;background:#E6DDF3}
.sticky{position:sticky;bottom:-24px;display:flex;gap:12px;padding:12px 0 24px;background:var(--bg);margin-top:8px}
.sticky button{flex:1;height:52px;font-size:16px}
.lockwrap{min-height:100%;display:flex;flex-direction:column;align-items:center;gap:16px;padding:28px 0;text-align:center}
.keys{display:grid;grid-template-columns:repeat(3,72px);gap:14px 24px;justify-content:center}
.key{width:72px;height:72px;border-radius:36px;padding:0;background:#fff;color:var(--ink);border:1px solid var(--line);font-size:28px;font-weight:600;display:flex;align-items:center;justify-content:center}
.key.fp{background:var(--soft);border-color:var(--soft)}
.key.del{background:transparent;border-color:transparent}
.compact .keys{grid-template-columns:repeat(3,60px);gap:10px 22px}
.compact .key{width:60px;height:60px;font-size:24px}
.dots{display:flex;gap:18px;justify-content:center;height:20px;align-items:center}
.dot{width:16px;height:16px;border-radius:8px;border:2px solid var(--gold)}
.dot.on{background:var(--gold)}
.opt{height:auto;width:100%;text-align:left;background:#fff;color:var(--ink);border:1px solid var(--line);border-radius:14px;padding:12px 14px;font-weight:400;display:flex;gap:12px;align-items:center;margin-bottom:10px}
.opt.on{background:var(--soft);border:2px solid var(--gold)}
.linkbtn{background:transparent;color:#6B4800;height:44px;font-size:14px;font-weight:600}
.hr{height:1px;background:var(--line);margin:14px 0 10px}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.stats .l{font-size:11px;color:var(--muted)}
.stats b{font-size:13px}
.logo{width:36px;height:36px;border-radius:18px;background:var(--gold);display:flex;align-items:center;justify-content:center}
.plus{width:44px;height:44px;padding:0;border-radius:22px;display:flex;align-items:center;justify-content:center}
.stepper{display:flex;align-items:center;justify-content:space-between;height:56px;border:1px solid var(--edge);border-radius:10px;background:#fff;padding:0 6px}
.stepper button{width:44px;height:44px;padding:0;font-size:24px;border-radius:8px}
button.acc .tag.brown{color:#5A2A12;background:#F6E0D3}
.lswrap{overflow:auto;max-height:calc(100vh - 290px);border-top:1px solid var(--line);border-bottom:1px solid var(--line);background:#fff;margin:0 -16px;-webkit-overflow-scrolling:touch}
table.lt{border-collapse:separate;border-spacing:0;font-size:13px;min-width:760px;width:100%}
.lt th{position:sticky;top:0;z-index:1;background:#F6E0D3;color:#5A2A12;text-align:right;font-size:12px;font-weight:700;padding:8px 10px;line-height:1.25;vertical-align:bottom;border-bottom:1px solid #E0C2B0}
.lt td{text-align:right;padding:0 10px;height:48px;border-bottom:1px solid #EFE4C6;white-space:nowrap;background:#fff}
.lt .s1{position:sticky;left:0;z-index:2;text-align:center;width:44px;min-width:44px;padding:0}
.lt .s2{position:sticky;left:44px;z-index:2;text-align:left;min-width:100px;box-shadow:2px 0 0 #E8DBB8}
.lt th.s1,.lt th.s2{z-index:3;background:#F6E0D3}
.lt tr.paid td{background:#EEF5EC}
.lt tr.next td{background:#FFF1D0;font-weight:700}
.cb{width:22px;height:22px;accent-color:#7A3B1D;margin:0;padding:0}
.empty{text-align:center;padding:48px 16px}
</style>
</head>
<body>
<div id="app">
  <div id="main"></div>
  <nav>
    <button id="navHome" onclick="go('home')"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 11l8-7 8 7"/><path d="M6 10v10h12V10"/></svg>Home</button>
    <button id="navBackup" onclick="go('backup')"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 18a4 4 0 010-8 5 5 0 019.6-1A4.5 4.5 0 0117 18z"/></svg>Backup</button>
  </nav>
</div>

<script>
var state = { bhishis: [], lends: [], khatas: [], loans: [], rates: { '22K': 0, '24K': 0 }, sel: null, selLend: null, selKhata: null };
var lendDraft = null;
var entryDraft = null;
var kEditing = -1;
var lockMode = '', lockBuf = '', lockMsg = '', lockReturn = 'home', lockCtx = '', lockFrom = '';
var setStep = 'create', setChoice = 'pin', firstPin = '', lockChanging = false, syncStarted = false;
var view = 'home';
var draft = null;
var editing = -1;
var email = '';
var syncMsg = '';
var pushTimer = null;
var rateStatus = {};
var CITIES = ['Pune','Mumbai','Nashik','Nagpur','Delhi','Chennai','Kolkata','Bengaluru','Hyderabad','Ahmedabad'];

function todayStr() {
  var d = new Date();
  var m = ('0' + (d.getMonth() + 1)).slice(-2);
  var day = ('0' + d.getDate()).slice(-2);
  return d.getFullYear() + '-' + m + '-' + day;
}
function esc(s) {
  return String(s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}
function num(v) { var n = parseFloat(String(v).replace(/,/g, '')); return isFinite(n) ? n : 0; }
function fmt(n) { return Math.round(n).toLocaleString('en-IN'); }
function fmtDate(s) {
  if (!s) return '-';
  var p = s.split('-');
  var mon = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return parseInt(p[2], 10) + ' ' + mon[parseInt(p[1], 10) - 1] + ' ' + p[0];
}
function nextBhishiName() {
  var mx = 0;
  state.bhishis.forEach(function (b) {
    var m = /^Gold Bhishi (\d+)$/.exec(b.name || '');
    if (m) mx = Math.max(mx, parseInt(m[1], 10));
  });
  return 'Gold Bhishi ' + (Math.max(mx, state.bhishis.length) + 1);
}
function newLendDraft() { return { name: '', amount: '', date: todayStr(), rate: '' }; }
function hasData(o) { return !!(o && ((o.bhishis && o.bhishis.length) || (o.lends && o.lends.length) || (o.khatas && o.khatas.length) || (o.loans && o.loans.length))); }
function fixState() {
  if (!state.bhishis) state.bhishis = [];
  if (!state.lends) state.lends = [];
  if (!state.khatas) state.khatas = [];
  if (!state.loans) state.loans = [];
  if (!state.rates) state.rates = { '22K': 0, '24K': 0 };
}
function newDraft() {
  return { name: nextBhishiName(), city: 'Pune', gold: '22K', amount: '', months: 12, start: todayStr() };
}

function load() {
  try {
    var s = window.Android ? Android.load() : localStorage.getItem('gb');
    if (s) {
      var o = JSON.parse(s);
      if (o && (o.bhishis || o.lends || o.khatas || o.loans)) { state = o; fixState(); }
    }
  } catch (e) {}
}
function save(fromRemote) {
  try {
    if (!fromRemote) state.updatedAt = Date.now();
    var s = JSON.stringify(state);
    if (window.Android) { Android.save(s); } else { localStorage.setItem('gb', s); }
  } catch (e) {}
  if (!fromRemote) schedulePush();
}
function schedulePush() {
  if (!window.Android || !email) return;
  clearTimeout(pushTimer);
  pushTimer = setTimeout(function () {
    syncMsg = 'Saving to Google Drive...';
    Android.push(JSON.stringify(state));
  }, 1500);
}

function cur() {
  for (var i = 0; i < state.bhishis.length; i++) {
    if (state.bhishis[i].id === state.sel) return state.bhishis[i];
  }
  return state.bhishis[0] || null;
}

function curLend() {
  for (var i = 0; i < state.lends.length; i++) {
    if (state.lends[i].id === state.selLend) return state.lends[i];
  }
  return null;
}

function autoRate(b) {
  var cr = state.cityRates && state.cityRates[b.city];
  return cr && cr[b.gold] > 0 ? cr[b.gold] : 0;
}
function rateOf(b) {
  if (b.rateOverride > 0) return b.rateOverride;
  return autoRate(b) || state.rates[b.gold] || 0;
}
function fetchCityRate(city, force) {
  if (!window.Android || !city) return;
  var cr = state.cityRates && state.cityRates[city];
  if (!force && cr && Date.now() - cr.at < 30 * 60 * 1000) return;
  rateStatus[city] = 'loading';
  Android.fetchRate(city);
}
function citySelect(id, value, onchange) {
  var h = '<select id="' + id + '" onchange="' + onchange + '">';
  CITIES.forEach(function (c) { h += '<option' + (c === value ? ' selected' : '') + '>' + c + '</option>'; });
  return h + '</select>';
}
function rateCard(b, c) {
  var city = b.city || '';
  var cr = state.cityRates && state.cityRates[city];
  var st = rateStatus[city];
  var info;
  if (b.rateOverride > 0) {
    info = 'Using your own rate. <button class="small soft" onclick="useAuto()">Use market rate</button>';
  } else if (st === 'loading') {
    info = 'Fetching ' + esc(city) + ' rate...';
  } else if (cr && cr[b.gold] > 0) {
    info = esc(city) + ' &middot; ' + esc(cr.date || 'today') + ' &middot; market rate';
  } else if (st) {
    info = 'Could not fetch (' + esc(st) + '). Enter the rate yourself.';
  } else {
    info = 'Enter today\'s rate yourself.';
  }
  return '<div class="card"><div class="row" style="align-items:flex-end"><div style="flex:1" class="f"><label for="rateIn">Today\'s ' + b.gold +
    ' rate (&#8377; per gram)</label><input id="rateIn" type="number" inputmode="decimal" value="' + (c.rate || '') + '" placeholder="e.g. 13060"></div>' +
    '<button onclick="setRate()">Update</button></div>' +
    '<div class="muted" style="margin:8px 0">' + info + '</div>' +
    '<div class="row"><div style="flex:1">' + citySelect('citySel', b.city || 'Pune', 'changeCity(this.value)') + '</div>' +
    '<button class="small soft" onclick="refreshRate()">Refresh</button></div></div>';
}

function calc(b) {
  var rate = rateOf(b);
  var paid = 0, grams = 0, value = 0;
  var rows = b.purchases.map(function (p) {
    var g = p.rate > 0 ? p.amount / p.rate : 0;
    var v = rate > 0 ? g * rate : 0;
    paid += p.amount; grams += g; value += v;
    return { g: g, v: v, pl: rate > 0 && g > 0 ? v - p.amount : null };
  });
  return { rate: rate, paid: paid, grams: grams, value: value, rows: rows,
           pl: rate > 0 && grams > 0 ? value - paid : null };
}

function plHtml(pl, withPct, paid) {
  if (pl === null) return '<span class="muted">-</span>';
  if (Math.abs(pl) < 0.5) return '<span>&#8377;0</span>';
  var up = pl >= 0;
  var s = (up ? '&#9650; ' : '&#9660; ') + '&#8377;' + fmt(Math.abs(pl));
  if (withPct && paid > 0) s += ' (' + (Math.abs(pl) / paid * 100).toFixed(1) + '%)';
  return '<span class="' + (up ? 'gain' : 'loss') + '">' + s + '</span>';
}

function go(v) {
  editing = -1; view = v;
  if (v === 'create') draft = newDraft();
  if (v === 'createLend') lendDraft = newLendDraft();
  render();
}
window.goBack = function () {
  if (view === 'lock' || view === 'setlock' || view === 'signin') return false;
  if (view === 'khataEdit') { view = 'khata'; render(); return true; }
  if (view === 'khataShare') { view = 'khata'; render(); return true; }
  if (view === 'import') { importDraft = null; view = 'home'; render(); return true; }
  if (view === 'loanSched') { view = 'loan'; render(); return true; }
  if (view === 'loanReview') { view = 'loanAdd'; render(); return true; }
  if (view !== 'home') { view = 'home'; render(); return true; }
  return false;
};
function openGold(id) {
  state.sel = id; editing = -1; view = 'gold'; render();
  var b = cur(); if (b) { fetchCityRate(b.city || 'Pune', false); }
}
function openLend(id) { state.selLend = id; view = 'lend'; render(); }

/* ---------- screens ---------- */
function renderGold() {
  var b = cur();
  if (!b) { view = 'home'; return renderHome(); }
  state.sel = b.id;
  var c = calc(b);
  var h = '<div class="row" style="margin-bottom:12px"><button class="small soft" onclick="go(\'home\')" aria-label="Back">&larr; Back</button>' +
          '<div><h1>' + esc(b.name) + '</h1><div class="muted" style="color:#2F6B2F;font-size:11px">' + b.gold + ' gold &middot; ' + esc(b.city || '') + (email ? ' &middot; Saved to Google Drive' : ' &middot; Saved on this phone') + '</div></div><button class="small soft" style="margin-left:auto;display:flex;align-items:center;gap:6px" onclick="pdfGold()" aria-label="Create PDF"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 3H7a2 2 0 00-2 2v14a2 2 0 002 2h10a2 2 0 002-2V8z"/><path d="M14 3v5h5"/></svg>PDF</button></div>';

  h += '<div class="dark"><div class="row between"><div><div class="lbl">Value today</div><div class="big">' +
       (c.rate > 0 ? '&#8377;' + fmt(c.value) : '-') + '</div></div>' +
       '<div style="text-align:right"><div class="lbl">Profit / Loss</div><div style="font-size:18px;font-weight:700">' +
       plHtml(c.pl, true, c.paid) + '</div></div></div>' +
       '<div style="height:1px;background:#4A3D27;margin:12px 0"></div>' +
       '<div class="row between"><div><div class="lbl">Total paid</div><b>&#8377;' + fmt(c.paid) + '</b></div>' +
       '<div style="text-align:center"><div class="lbl">Gold bought</div><b>' + c.grams.toFixed(3) + ' g</b></div>' +
       '<div style="text-align:right"><div class="lbl">Months paid</div><b>' + b.purchases.length + ' of ' + b.months + '</b></div></div></div>';

  h += rateCard(b, c);

  h += '<div class="row between" style="margin:14px 4px 8px"><h2>My purchases</h2><span class="muted">&#8377;' + fmt(b.amount) + ' / month &middot; ' + b.gold + '</span></div>';

  b.purchases.forEach(function (p, i) {
    var r = c.rows[i];
    h += '<div class="card" onclick="toggleEdit(' + i + ')"><div class="row between" style="margin-bottom:10px"><div class="row"><div class="badge">' + (i + 1) + '</div>' +
         '<b>' + fmtDate(p.date) + '</b></div><b>' + plHtml(r.pl, false, 0) + '</b></div>' +
         '<div class="stats">' +
         '<div><div class="l">Paid</div><b>&#8377;' + fmt(p.amount) + '</b></div>' +
         '<div><div class="l">Rate that day</div><b>' + (p.rate > 0 ? '&#8377;' + fmt(p.rate) : '-') + '</b></div>' +
         '<div><div class="l">Grams</div><b>' + r.g.toFixed(3) + ' g</b></div>' +
         '<div><div class="l">Value today</div><b>' + (c.rate > 0 ? '&#8377;' + fmt(r.v) : '-') + '</b></div></div>';
    if (editing === i) {
      h += '<div onclick="event.stopPropagation()"><div class="grid4 f" style="margin-top:12px">' +
           '<div><label>Date</label><input type="date" value="' + esc(p.date) + '" onchange="edit(' + i + ',\'date\',this.value)"></div>' +
           '<div><label>Paid (&#8377;)</label><input type="number" inputmode="decimal" value="' + p.amount + '" onchange="edit(' + i + ',\'amount\',this.value)"></div>' +
           '<div><label>Rate that day (&#8377;/g)</label><input type="number" inputmode="decimal" value="' + (p.rate || '') + '" placeholder="enter rate" onchange="edit(' + i + ',\'rate\',this.value)"></div></div>' +
           '<div class="row between" style="margin-top:8px"><button class="danger" onclick="delPurchase(' + i + ')">Delete</button><button class="small soft" onclick="toggleEdit(-1)">Done</button></div></div>';
    } else {
      h += '<div class="muted" style="margin-top:8px">Tap to edit</div>';
    }
    h += '</div>';
  });

  h += '<button class="ghost" onclick="addPurchase()">+ Add purchase</button><div class="pad"></div>' +
       '<div style="text-align:center"><button class="danger" onclick="delBhishi()">Delete this Gold Bhishi</button></div>';
  return h;
}


function lendCalc(l) {
  var amt = l.amount || 0;
  var start = new Date((l.date || todayStr()) + 'T00:00:00');
  var days = Math.max(0, Math.floor((Date.now() - start.getTime()) / 86400000));
  var interest = amt * (l.rate || 0) / 100 * days / 365;
  var repaid = 0;
  (l.repayments || []).forEach(function (r) { repaid += r.amount || 0; });
  var due = Math.max(0, amt + interest - repaid);
  return { interest: interest, repaid: repaid, due: due, days: days, done: amt > 0 && due < 0.5 };
}

function renderHome() {
  var h = '<div class="row" style="margin-bottom:12px"><div class="logo"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFF9EC" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 15l2-8h8l2 8z"/><path d="M3 19h18"/></svg></div>' +
          '<div><h1>Apna Khata</h1><div class="muted" style="color:#2F6B2F;font-size:11px">' + (email ? 'Saved to Google Drive &middot; ' + esc(email) : 'Saved on this phone') + '</div></div></div>';

function sortedEntries(k) {
  return k.entries.map(function (e, i) { return { e: e, i: i }; }).sort(function (a, b) {
    return a.e.date < b.e.date ? 1 : a.e.date > b.e.date ? -1 : b.i - a.i;
  });
}
function kCalc(k) {
  var gave = 0, got = 0, interest = 0;
  k.entries.forEach(function (e) {
    if (e.type === 'gave') {
      gave += e.amount;
      var days = Math.max(0, Math.floor((Date.now() - new Date(e.date + 'T00:00:00').getTime()) / 86400000));
      interest += e.amount * (k.rate || 0) / 100 * days / 365;
    } else { got += e.amount; }
  });
  return { gave: gave, got: got, interest: interest, bal: gave - got + interest };
}
function curKhata() {
  for (var i = 0; i < state.khatas.length; i++) if (state.khatas[i].id === state.selKhata) return state.khatas[i];

function findKhataByName(n) {

}

  if (setStep === 'create') { firstPin = lockBuf; lockBuf = ''; setStep = 'confirm'; render(); return; }

    var okp = Android.pinSet(lockBuf);
    lockBuf = ''; firstPin = '';
    if (okp) { lockMode = 'pin'; finishLockSetup(); } else { lockMsg = 'Could not save the PIN'; setStep = 'create'; render(); }
  } else { lockBuf = ''; firstPin = ''; setStep = 'create'; lockMsg = 'PINs did not match. Start again.'; render(); }
}

    if (lockCtx === 'setup') { Android.setLockMode('phone'); lockMode = 'phone'; finishLockSetup(); return; }
  }
  lockMsg = lockCtx === 'setup' ? 'Phone lock was not confirmed.' : 'Not unlocked. Try again.';

};

/* ---- Loan PDF parsing (shared by app + tests) ---- */
var LP_AMT='[\\d,]+\\.\\d{2}';
var LP_ROW=new RegExp('^(?:(\\d{1,4})\\s+)?(\\d{2}\\/\\d{2}\\/\\d{4})\\s+('+LP_AMT+')\\s+('+LP_AMT+')\\s+('+LP_AMT+')\\s+('+LP_AMT+')\\s+('+LP_AMT+')\\s+(\\d{1,2}\\.\\d{1,2})\\s+(\\S+)\\s+('+LP_AMT+')\\s+('+LP_AMT+')(?:\\s+\\S+)?\\s*$');

function lpIso(d){var m=/^(\d{2})\/(\d{2})\/(\d{4})$/.exec(d);return m?m[3]+'-'+m[2]+'-'+m[1]:''}
/* items: [{x,y,t}] for one page, y grows downward. Returns array of line strings top->bottom */
function lpLines(items){
  var rows=[];
  items.sort(function(a,b){return a.y-b.y});
  items.forEach(function(it){
    var r=null;
    for(var i=rows.length-1;i>=0;i--){ if(Math.abs(rows[i].y-it.y)<=3){r=rows[i];break} if(rows[i].y<it.y-3)break }
    if(!r){r={y:it.y,c:[]};rows.push(r)}
    r.c.push(it);
  });
  rows.sort(function(a,b){return a.y-b.y});
  return rows.map(function(r){r.c.sort(function(a,b){return a.x-b.x});return r.c.map(function(c){return c.t}).join(' ').replace(/\s+/g,' ').trim()}).filter(Boolean);
}
/* pages: array of arrays of lines */
function parseLoanLines(pages){
  var inst=[],all=[],seen={};
  pages.forEach(function(lines){lines.forEach(function(l){all.push(l);
    var m=LP_ROW.exec(l); if(!m||!m[1])return;
    var n=parseInt(m[1],10); if(seen[n])return; seen[n]=1;
    inst.push({n:n,due:lpIso(m[2]),open:lpNum(m[3]),emi:lpNum(m[4]),prin:lpNum(m[5]),int:lpNum(m[6]),close:lpNum(m[7]),rate:parseFloat(m[8]),type:m[9],total:lpNum(m[11]),paid:false});
  })});
  inst.sort(function(a,b){return a.n-b.n});
  var head=(pages[0]||[]).join(' \n ');
  var out={installments:inst,agreement:'',sanction:0,product:'',lender:'',rateNow:0,emi:0};
  var mm;
  if((mm=/Agreement No\.?\s*:\s*([A-Z0-9]+)/.exec(head))) out.agreement=mm[1];
  var jn=(pages[0]||[]).join(' | ');
  if((mm=/Product\s*:\s*([A-Za-z ]+?)(?:\s*\||$)/.exec(jn))) out.product=mm[1].trim();
  if((mm=/Original Sanction Amount\s*:\s*([\d,]+\.\d{2})/.exec(jn))) out.sanction=lpNum(mm[1]);
  if((mm=/Interest Rate\s*:\s*(\d{1,2}\.\d{1,2})/.exec(jn))) out.rateNow=parseFloat(mm[1]);
  if((mm=/Interest Start Date\s*:\s*(\d{2}\/\d{2}\/\d{4})/.exec(jn))) out.startDate=lpIso(mm[1]);
  all.forEach(function(l){ if(!out.lender&&/\b(FINANCE|BANK|LTD|LIMITED)\b/i.test(l)&&l.length<60&&!/\d{2}\/\d{2}\/\d{4}/.test(l)) out.lender=l; });

  function row(k, v) { return '<div class="row between" style="padding:9px 0;border-bottom:1px solid #F0E6C8"><span class="muted" style="font-size:13px">' + k + '</span><b style="font-size:14px;text-align:right">' + v + '</b></div>'; }
  return '<div class="row" style="margin-bottom:12px"><button class="small soft" onclick="view=\'loanAdd\';render()" aria-label="Back">&larr; Back</button><h1>Check details</h1></div>' +
    '<div class="muted" style="margin-bottom:10px;line-height:1.4">Read from your PDF. Please check, then save.</div>' +
    '<div class="card" style="padding:4px 14px">' +
    row('Loan name', esc(d.name)) + row('Type', d.type) + (r.lender ? row('Lender', esc(r.lender)) : '') + (r.agreement ? row('Agreement no.', '&bull;&bull;&bull;&bull; ' + esc(r.agreement.slice(-4))) : '') +
    row('Loan amount', rs(r.sanction || sp)) + row('Interest rate now', (next ? next.rate : r.rateNow) + '%') + row('EMI', rs(next ? next.emi : ins[ins.length - 1].emi)) +
    row('Installments', ins.length) + row('First EMI', fmtDate(ins[0].due)) + row('Last EMI', fmtDate(ins[ins.length - 1].due)) + row('Total interest', rs(si)) +
    row('Already paid', paidN + ' installments') + '</div>' +
    (warn ? '<div class="card" style="background:#FDECEA;border-color:#F3C2BC;color:#A3261A;font-size:13px;line-height:1.4">The principal in the schedule does not add up to the loan amount. Some rows may not have been read. You can still save, but please check.</div>' : '') +
    '<div class="muted" style="margin:6px 0 14px;line-height:1.4">Paid installments are those with Total Amount Due 0 and a date up to today. Only the last 4 digits of the agreement number are kept. Your name is not saved.</div>' +
    '<button style="height:54px;font-size:17px;width:100%;background:#7A3B1D" onclick="saveLoanFromDraft(false)">Save loan</button>';
}
function renderLoan() {
  var l = curLoan(); if (!l) { view = 'home'; return renderHome(); }
  var c = loanCalc(l), pct = c.n ? Math.round(c.paidN * 1000 / c.n) / 10 : 0, ins = l.installments;
  function row(k, v) { return '<div class="row between" style="padding:9px 0;border-bottom:1px solid #F0E6C8"><span class="muted" style="font-size:13px">' + k + '</span><b style="font-size:14px;text-align:right">' + v + '</b></div>'; }
  return '<div class="row between" style="margin-bottom:10px"><div class="row"><button class="small soft" onclick="go(\'home\')" aria-label="Back">&larr; Back</button><div><h1>' + esc(l.name) + '</h1><div class="muted" style="font-size:11px">' + esc(l.lender || (l.type + ' loan')) + (c.rate ? ' &middot; ' + c.rate + '% now' : '') + '</div></div></div>' +
    '<button class="small soft" onclick="pdfLoan()">PDF</button></div>' +
    '<button onclick="loanFilter=\'upcoming\';view=\'loanSched\';render()" aria-label="Open loan details" style="width:100%;height:auto;text-align:left;font-weight:400;background:#2B2113;color:#FFF9EC;border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px">' +
    '<div class="row between" style="align-items:flex-end;width:100%"><div><div style="font-size:12px;color:#E5D3A8">Principal left</div><div class="big">&#8377;' + fmt(c.pLeft) + '</div></div>' +
    '<div style="text-align:right"><div style="font-size:12px;color:#E5D3A8">' + (c.next ? 'Next EMI &middot; ' + fmtDate(c.next.due) : 'Loan finished') + '</div><div style="font-size:18px;font-weight:700">' + (c.next ? '&#8377;' + fmt(dueAmt(c.next)) : '&#10003;') + '</div></div></div>' +
    '<div style="width:100%"><div style="height:8px;border-radius:4px;background:#4A3D27;overflow:hidden"><div style="width:' + pct + '%;height:100%;background:#E8B84A"></div></div>' +
    '<div style="font-size:12px;color:#E5D3A8;margin-top:6px">' + c.paidN + ' of ' + c.n + ' installments paid &middot; ' + (c.n - c.paidN) + ' left</div></div>' +
    '<div style="height:1px;background:#4A3D27;width:100%"></div>' +
    '<div class="row between" style="width:100%;align-items:flex-start"><div><div style="font-size:12px;color:#E5D3A8">Principal paid</div><div style="font-size:15px;font-weight:600">&#8377;' + fmt(c.pPaid) + '</div></div>' +
    '<div style="text-align:center"><div style="font-size:12px;color:#E5D3A8">Interest paid</div><div style="font-size:15px;font-weight:600">&#8377;' + fmt(c.intPaid) + '</div></div>' +
    '<div style="text-align:right"><div style="font-size:12px;color:#E5D3A8">Left to pay</div><div style="font-size:15px;font-weight:600">&#8377;' + fmt(c.left) + '</div></div></div>' +
    '<div style="width:100%;text-align:center;border-radius:8px;background:#3A2E1B;font-size:13px;font-weight:700;color:#F8E3A3;padding:7px 0">View loan details &rsaquo;</div></button>' +
    '<div class="card" style="margin-top:14px;padding:4px 14px">' + row('Loan amount', rs(c.sanction)) + row('Monthly EMI', rs(c.emi)) + (c.rate ? row('Interest rate now', c.rate + '%') : '') +
    row('First EMI', ins.length ? fmtDate(ins[0].due) : '-') + row('Last EMI', ins.length ? fmtDate(ins[ins.length - 1].due) : '-') + row('Total interest', rs(c.totInt)) +
    (l.agreement ? row('Agreement no.', '&bull;&bull;&bull;&bull; ' + esc(l.agreement)) : '') + '</div>' +
    '<div style="text-align:center;margin-top:10px"><button class="danger" onclick="delLoan()">Delete this loan</button></div>';
}
function renderLoanSched() {
  var l = curLoan(); if (!l) { view = 'home'; return renderHome(); }
  var c = loanCalc(l), ins = l.installments, rows = '';
  ins.forEach(function (x, i) {
    if (loanFilter === 'upcoming' && x.paid) return;
    if (loanFilter === 'paid' && !x.paid) return;
    var isNext = c.next === x, cls = x.paid ? 'paid' : (isNext ? 'next' : 'due');
    rows += '<tr class="' + cls + '"' + (isNext ? ' id="lsNext"' : '') + '><td class="s1"><input class="cb" type="checkbox"' + (x.paid ? ' checked' : '') + ' onchange="loanTick(' + i + ')" aria-label="Installment ' + x.n + ' paid"></td>' +
      '<td class="s2">' + fmtDate(x.due) + '</td><td>&#8377;' + fmt(x.open) + '</td><td>&#8377;' + fmt(x.prin) + '</td><td>&#8377;' + fmt(x.int) + '</td><td>&#8377;' + fmt(x.close) + '</td><td>&#8377;' + fmt(dueAmt(x)) + '</td></tr>';
  });
  if (!rows) rows = '<tr><td colspan="7" style="text-align:center;padding:30px;height:auto">Nothing here</td></tr>';
  function chip(f, t) { return '<button class="' + (loanFilter === f ? 'on' : '') + '" onclick="setLoanFilter(\'' + f + '\')">' + t + '</button>'; }
  return '<div class="row" style="margin-bottom:8px"><button class="small soft" onclick="view=\'loan\';render()" aria-label="Back">&larr; Back</button><div><h1>Loan details</h1><div class="muted" style="font-size:11px">' + esc(l.name) + ' &middot; ' + c.n + ' installments</div></div></div>' +
    '<div class="chips">' + chip('upcoming', 'Upcoming') + chip('paid', 'Paid') + chip('all', 'All') + '</div>' +
    '<div id="lsWrap" class="lswrap"><table class="lt"><thead><tr><th class="s1">Paid</th><th class="s2">Due date</th><th>Opening principal</th><th>Principal</th><th>Interest</th><th>Closing principal</th><th>Total amount due</th></tr></thead><tbody>' + rows + '</tbody></table></div>' +
    '<div class="muted" style="margin-top:8px;line-height:1.4">Slide the table sideways to see all columns. Tick the box when you pay an EMI.</div>';
}
function pdfLoan() {
  var l = curLoan(); if (!l) return;
  var c = loanCalc(l);
  var t = '<table><tr><th>#</th><th>Due date</th><th class="r">Opening principal</th><th class="r">Principal</th><th class="r">Interest</th><th class="r">Closing principal</th><th class="r">Total amount due</th><th>Paid</th></tr>';
  l.installments.forEach(function (x) {
    t += '<tr' + (x.paid ? ' style="background:#EEF5EC"' : '') + '><td>' + x.n + '</td><td>' + fmtDate(x.due) + '</td><td class="r">' + rs(x.open) + '</td><td class="r">' + rs(x.prin) + '</td><td class="r">' + rs(x.int) + '</td><td class="r">' + rs(x.close) + '</td><td class="r">' + rs(dueAmt(x)) + '</td><td>' + (x.paid ? 'Yes' : '') + '</td></tr>';
  });
  t += '</table>';
  var body = '<div style="margin-top:14px"><div class="sub">' + esc(l.type) + ' loan' + (l.lender ? ' &middot; ' + esc(l.lender) : '') + '</div><div style="font-size:18px;font-weight:700">' + esc(l.name) + '</div></div>' +
    '<div class="sum"><div><span>Loan amount</span><span>' + rs(c.sanction) + '</span></div><div><span>Installments paid</span><span>' + c.paidN + ' of ' + c.n + '</span></div>' +
    '<div><span>Principal paid</span><span>' + rs(c.pPaid) + '</span></div><div><span>Interest paid</span><span>' + rs(c.intPaid) + '</span></div><div><span>Left to pay</span><span>' + rs(c.left) + '</span></div>' +
    '<div class="big"><span>Principal left</span><span>' + rs(c.pLeft) + '</span></div></div>' + t;
  sendPdf(pdfWrap('Loan Statement', '', body), l.name);
}

/* ---------- Share khata + add from link ---------- */
var SHARE_URL = 'https://swaps86.github.io/gold-bhishi/a#';
var shareMode = 'full', pendingShare = null, importDraft = null;
function b64e(s) { return btoa(unescape(encodeURIComponent(s))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, ''); }
function b64d(s) { s = String(s).replace(/-/g, '+').replace(/_/g, '/'); while (s.length % 4) s += '='; return decodeURIComponent(escape(atob(s))); }
function r2(n) { return Math.round(n * 100) / 100; }
/* items = what goes into the message/link, oldest first: {date,type:'g'|'r',amount,note} (g = I gave, r = I got) */
function shareItems(k, mode) {
  var N = mode === 'full' ? 40 : (mode === 'last5' ? 5 : 0);
  var es = k.entries.map(function (e, i) { return { e: e, i: i }; }).sort(function (a, b) { return a.e.date < b.e.date ? -1 : a.e.date > b.e.date ? 1 : a.i - b.i; }).map(function (x) { return x.e; });
  var keep = N > 0 ? es.slice(-N) : [], older = es.slice(0, es.length - keep.length), items = [];
  if (older.length) {
    var net = 0; older.forEach(function (e) { net += (e.type === 'gave' ? 1 : -1) * e.amount; });
    if (Math.abs(net) >= 0.5) items.push({ date: keep.length ? keep[0].date : older[older.length - 1].date, type: net > 0 ? 'g' : 'r', amount: r2(Math.abs(net)), note: 'Earlier entries' });
  }
  keep.forEach(function (e) { items.push({ date: e.date, type: e.type === 'gave' ? 'g' : 'r', amount: r2(e.amount), note: (e.note || '').slice(0, 40) }); });
  var c = kCalc(k);
  if (k.rate > 0 && c.interest >= 1) items.push({ date: todayStr(), type: 'g', amount: Math.round(c.interest), note: 'Interest ' + k.rate + '% till today' });
  return items;
}
function shareTotals(items) {
  var g = 0, r = 0; items.forEach(function (x) { if (x.type === 'g') g += x.amount; else r += x.amount; });
  return { g: g, r: r, bal: g - r };
}
function rsText(n) { return 'Rs ' + fmt(n); }
function buildShareText(k, mode, plain, short) {
  var items = shareItems(k, mode), t = shareTotals(items);
  var b = function (s) { return plain ? s : '*' + s + '*'; };
  var L = [b('Apna Khata - Statement'), 'Account: ' + k.name, 'As on ' + fmtDate(todayStr()), ''];
  if (mode !== 'balance') {
    items.forEach(function (x) { L.push(fmtDate(x.date) + ' - ' + (x.type === 'g' ? 'I gave' : 'I got') + ': ' + rsText(x.amount) + (x.note ? ' (' + x.note + ')' : '')); });
    L.push('', 'Total I gave: ' + rsText(t.g), 'Total I got: ' + rsText(t.r));
  }
  L.push(b(Math.abs(t.bal) < 0.5 ? 'Account is settled' : (t.bal > 0 ? 'Balance: you will pay me ' + rsText(t.bal) : 'Balance: I will pay you ' + rsText(-t.bal))));
  L.push('', 'Have the Apna Khata app? Tap to add this to your khata:', short ? SHARE_URL + shareLink(k, mode).slice(0, 18) + '...' : SHARE_URL + shareLink(k, mode), '', 'Sent from Apna Khata app');
  return L.join('\n');
}
function shareLink(k, mode) {
  var p = { v: 1, n: (state.myName || '').trim().slice(0, 40) || 'Friend', e: shareItems(k, mode).map(function (x) { return [x.date, x.type, x.amount, x.note]; }) };
  return b64e(JSON.stringify(p));
}
function curShareKhata() { return curKhata(); }
function openShare() { shareMode = 'full'; view = 'khataShare'; render(); }
function setShareMode(m) { shareMode = m; var y = document.getElementById('main').scrollTop; render(); document.getElementById('main').scrollTop = y; }
function renderShare() {
  var k = curKhata(); if (!k) { view = 'home'; return renderHome(); }
  function seg(m, t) { return '<button class="' + (shareMode === m ? 'on' : '') + '" style="font-size:13px;height:44px" onclick="setShareMode(\'' + m + '\')">' + t + '</button>'; }
  var prev = esc(buildShareText(k, shareMode, false, true)).replace(/\*(.+?)\*/g, '<b>$1</b>');
  var n = k.entries.length;
  return '<div class="row" style="margin-bottom:10px"><button class="small soft" onclick="view=\'khata\';render()" aria-label="Back">&larr; Back</button><div><h1>Share khata</h1><div class="muted" style="font-size:11px">' + esc(k.name) + ' &middot; sent as a normal text message</div></div></div>' +
    '<div class="f" style="margin-bottom:12px"><label style="font-size:13px;font-weight:600">Your name (she/he will see this)</label><input type="text" id="myname" value="' + esc(state.myName || '') + '" placeholder="e.g. Swapnil" oninput="state.myName=this.value" onchange="save()"></div>' +
    '<div class="seg" style="margin-bottom:12px;gap:8px">' + seg('full', 'Full khata') + seg('last5', 'Last 5 entries') + seg('balance', 'Balance only') + '</div>' +
    (shareMode === 'full' && n > 40 ? '<div class="muted" style="margin:-4px 0 10px;line-height:1.4">You have ' + n + ' entries. The last 40 are listed; older ones are added up into one &ldquo;Earlier entries&rdquo; line so the balance stays correct.</div>' : '') +
    '<div style="font-size:13px;font-weight:600;color:#4A3D27;margin-bottom:6px">Message preview</div>' +
    '<div style="background:#E3F1DC;border:1px solid #C5DFBA;border-radius:14px 14px 4px 14px;padding:12px 14px;white-space:pre-wrap;font-size:13.5px;line-height:1.5;overflow-wrap:anywhere">' + prev + '</div>' +
    '<div class="sticky" style="flex-direction:column;gap:8px"><button style="height:52px;font-size:16px;background:#2F6B2F;flex:none" onclick="shareSend(\'whatsapp\')">Send on WhatsApp</button>' +
    '<div class="row" style="gap:8px"><button class="soft" style="flex:1;height:44px;font-size:14px" onclick="shareSend(\'sms\')">SMS</button><button class="soft" style="flex:1;height:44px;font-size:14px" onclick="shareSend(\'other\')">Other apps</button><button class="soft" style="flex:1;height:44px;font-size:14px" onclick="shareSend(\'copy\')">Copy</button></div>' +
    '<div class="muted" style="text-align:center;line-height:1.35;font-size:11px">' + (k.phone ? 'WhatsApp and SMS open the chat with ' + esc(k.phone) + '.' : 'No phone saved for ' + esc(k.name) + ', so you pick the contact yourself. Save a number with &#9998; to open the chat directly.') + '</div></div>';
}
function shareSend(how) {
  var k = curKhata(); if (!k) return;
  if (!(state.myName || '').trim()) { alert('Please type your name first'); var el = document.getElementById('myname'); if (el) el.focus(); return; }
  save();
  var plain = how !== 'whatsapp', mode = (how === 'sms' && shareMode === 'full') ? 'last5' : shareMode;
  var text = buildShareText(k, mode, how === 'sms', false);
  if (window.Android) {
    if (how === 'copy') { Android.copyText(text); alert('Copied. Paste it in any chat.'); }
    else Android.shareText(text, how, k.phone || '');
  } else { window.__shared = { how: how, text: text }; alert('Sharing works inside the Android app'); }
}
window.onShareError = function (m) { alert(m || 'Could not open that app'); };
/* ----- receiving ----- */
function parseShare(d) {
  if (!d || d.length > 20000) return null;
  try {
    var o = JSON.parse(b64d(d));
    if (!o || o.v !== 1 || !Array.isArray(o.e) || o.e.length > 120) return null;
    var items = [];
    for (var i = 0; i < o.e.length; i++) {
      var x = o.e[i], a = Number(x[2]);
      if (!/^\d{4}-\d{2}-\d{2}$/.test(String(x[0])) || (x[1] !== 'g' && x[1] !== 'r') || !isFinite(a) || a <= 0 || a > 1e11) return null;
      items.push({ date: x[0], type: x[1], amount: a, note: String(x[3] || '').slice(0, 60) });
    }
    return { name: String(o.n || 'Friend').slice(0, 40), items: items };
  } catch (e) { return null; }
}
window.onShareLink = function (d) { pendingShare = d; render(); };
function tryImport() {
  var d = pendingShare; pendingShare = null;
  var p = parseShare(d);
  if (!p) { alert('This link is not valid or is incomplete'); return false; }
  importDraft = { name: p.name, items: p.items, from: p.name };
  view = 'import'; return true;
}
function renderImport() {
  var d = importDraft; if (!d) { view = 'home'; return renderHome(); }
  var t = shareTotals(d.items), bal = -t.bal;           /* from the receiver's side: positive = you will get */
  var rows = d.items.map(function (x) {
    var gave = x.type === 'r';                           /* sender got = receiver gave */
    return '<div class="card" style="margin-bottom:8px"><div class="row between"><div><b>' + fmtDate(x.date) + '</b><div class="muted">' + esc(x.note || '') + '</div></div>' +
      '<div style="text-align:right"><div style="font-size:16px;font-weight:700;color:' + (gave ? '#A3261A' : '#2F6B2F') + '">&#8377;' + fmt(x.amount) + '</div><div style="font-size:12px;font-weight:600;color:' + (gave ? '#A3261A' : '#2F6B2F') + '">' + (gave ? '&#9650; You gave' : '&#9660; You got') + '</div></div></div></div>';
  }).join('');
  return '<div class="row" style="margin-bottom:10px"><button class="small soft" onclick="importDraft=null;go(\'home\')" aria-label="Back">&larr; Back</button><div><h1>Add to your khata</h1><div class="muted" style="font-size:11px">Opened from a shared link</div></div></div>' +
    '<div class="card" style="background:#FFF1D0;border-color:#E8D08A;font-size:13px;line-height:1.45"><b>' + esc(d.from) + '</b> sent you a khata statement. Check it, then add it to your Apna Khata.</div>' +
    '<div class="dark"><div class="lbl">' + (Math.abs(bal) < 0.5 ? 'Settled' : (bal > 0 ? 'You will get' : 'You will give')) + '</div><div class="big">&#8377;' + fmt(Math.abs(bal)) + '</div>' +
    '<div style="height:1px;background:#4A3D27;margin:12px 0"></div><div class="row between"><div><div class="lbl">Total you gave</div><b>&#8377;' + fmt(t.r) + '</b></div><div style="text-align:right"><div class="lbl">Total you got</div><b>&#8377;' + fmt(t.g) + '</b></div></div></div>' +
    '<div class="muted" style="margin:6px 4px 8px">Entries &mdash; shown from your side</div>' + (rows || '<div class="card muted" style="text-align:center">No entries, balance only.</div>') +
    '<div class="f" style="margin:12px 0 6px"><label style="font-size:13px;font-weight:600">Save in my khata as</label><input type="text" value="' + esc(d.name) + '" oninput="importDraft.name=this.value"></div>' +
    '<div class="muted" style="line-height:1.4;margin-bottom:6px">Already have this name in your khata? Its entries are replaced by this statement, nothing is added twice. This is a copy &mdash; it does not change later by itself.</div>' +
    '<div class="sticky" style="flex-direction:column;gap:6px"><button style="height:52px;font-size:16px;flex:none" onclick="doImport()">Add to my Apna Khata</button><button class="linkbtn" style="flex:none" onclick="importDraft=null;go(\'home\')">Not now</button></div>';
}
function doImport() {
  var d = importDraft; if (!d) return;
  var nm = (d.name || '').trim(); if (!nm) { alert('Enter a name'); return; }
  var ents = d.items.map(function (x) { return { type: x.type === 'g' ? 'got' : 'gave', amount: x.amount, date: x.date, note: x.note }; });
  var k = findKhataByName(nm);
  if (k) {
    if (!confirm('"' + k.name + '" is already in your khata with ' + k.entries.length + ' entries. Replace them with this statement?\n\n(To keep both, press Cancel and change the name.)')) return;
    k.entries = ents;
  } else {
    k = { id: 'k' + Date.now().toString(36), name: nm, phone: '', rate: 0, entries: ents };
    state.khatas.push(k);
  }
  state.selKhata = k.id; kEditing = -1; importDraft = null;
  save(); view = 'khata'; render();
}
function importFromMessage() {
  var t = (document.getElementById('shmsg').value || '');
  var m = /\/a#([A-Za-z0-9_-]{8,})/.exec(t);
  if (!m) { alert('No Apna Khata link found in this text'); return; }
  pendingShare = m[1]; render();
}

load();
function startView() {
  if (!window.Android) return 'home';
  var skipped = false;
  try { skipped = !!localStorage.getItem('gb_skip'); } catch (e) {}
  if (!email && !skipped) return 'signin';
  return lockMode === '' ? 'setlock' : 'home';
}
if (window.Android) {
  try { var ps = Android.takeShare ? Android.takeShare() : ''; if (ps) pendingShare = ps; } catch (e) {}
  email = Android.getEmail() || '';
  lockMode = Android.lockMode() || '';
}
if (window.Android && (lockMode === 'pin' || lockMode === 'phone')) {
  lockReturn = startView(); view = 'lock'; render();
  if (lockMode === 'phone') tryPhone('unlock');
} else {
  view = startView(); render(); startSync();
}
</script>
