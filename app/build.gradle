plugins {
    id 'com.android.application'
}

android {
    namespace 'com.swaps.goldbhishi'
    compileSdk 34

    defaultConfig {
        applicationId 'com.swaps.goldbhishi'
        minSdk 24
        targetSdk 34
        versionCode 2
        versionName '1.1'
    }

    // Fixed key, so Google sign-in recognises the app on every build.
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}

dependencies {
    implementation 'com.google.android.gms:play-services-auth:21.2.0'
}
